<div class="min-h-screen bg-zinc-50 dark:bg-zinc-950 flex items-center justify-center p-4 sm:p-6 lg:p-8 text-zinc-900 dark:text-zinc-100 font-sans transition-colors duration-150">
  <div class="w-full max-w-xl">
    <!-- Header / Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 mb-4 text-zinc-900 dark:text-zinc-100 shadow-xs">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 border border-zinc-200 dark:border-zinc-700 mb-2">
        Configuração Inicial
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100 mt-1">Cadastre sua Barbearia</h1>
      <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">Configure sua unidade para ativar os agendamentos online</p>
    </div>

    <!-- Card Form -->
    <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-6 sm:p-8 shadow-sm transition-colors duration-150">
      
      <!-- Error Alert -->
      @if (errorMessage()) {
        <div class="mb-5 p-3.5 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-500/30 text-red-600 dark:text-red-400 text-xs flex items-start gap-2.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <div class="flex-1 font-medium">{{ errorMessage() }}</div>
        </div>
      }

      <form [formGroup]="tenantForm" (ngSubmit)="onSubmit()" class="space-y-4">
        
        <!-- Nome Fantasia -->
        <div>
          <label for="companyName" class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">Nome da Barbearia</label>
          <input
            type="text"
            id="companyName"
            formControlName="companyName"
            (input)="onNameChange()"
            placeholder="Ex: Barbearia Navalhex Prime"
            class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none focus:border-zinc-600 dark:focus:border-zinc-500 transition text-sm"
          />
        </div>

        <!-- Slug / Link Público -->
        <div>
          <label for="slug" class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">Link Personalizado (Slug)</label>
          <div class="flex rounded-xl bg-white dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 focus-within:border-zinc-600 dark:focus-within:border-zinc-500 transition overflow-hidden">
            <span class="inline-flex items-center px-3 text-xs text-zinc-500 bg-zinc-50 dark:bg-zinc-900 border-r border-zinc-200 dark:border-zinc-800">navalhex.com/</span>
            <input
              type="text"
              id="slug"
              formControlName="slug"
              placeholder="barbearia-prime"
              class="w-full px-3 py-2.5 bg-transparent text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none text-sm"
            />
          </div>
          <p class="text-[11px] text-zinc-500 mt-1">Link direto que seus clientes usarão para agendar.</p>
        </div>

        <!-- Horários de Funcionamento (Grid) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="openingHours" class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">Horário de Abertura</label>
            <input
              type="time"
              id="openingHours"
              formControlName="openingHours"
              class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-zinc-600 dark:focus:border-zinc-500 transition text-sm"
            />
          </div>

          <div>
            <label for="closingHours" class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">Horário de Fechamento</label>
            <input
              type="time"
              id="closingHours"
              formControlName="closingHours"
              class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 text-zinc-900 dark:text-zinc-100 focus:outline-none focus:border-zinc-600 dark:focus:border-zinc-500 transition text-sm"
            />
          </div>
        </div>

        <!-- WhatsApp da Barbearia -->
        <div>
          <label for="whatsapp" class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">WhatsApp Comercial</label>
          <input
            type="text"
            id="whatsapp"
            formControlName="whatsapp"
            placeholder="(11) 98765-4321"
            class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none focus:border-zinc-600 dark:focus:border-zinc-500 transition text-sm"
          />
        </div>

        <!-- Endereço Completo -->
        <div>
          <label for="companyAddress" class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">Endereço da Unidade</label>
          <input
            type="text"
            id="companyAddress"
            formControlName="companyAddress"
            placeholder="Ex: Av. Paulista, 1000 - Bela Vista, São Paulo - SP"
            class="w-full px-3.5 py-2.5 rounded-xl bg-white dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 dark:placeholder-zinc-500 focus:outline-none focus:border-zinc-600 dark:focus:border-zinc-500 transition text-sm"
          />
        </div>

        <!-- Submit Button -->
        <div class="pt-3">
          <button
            type="submit"
            [disabled]="tenantForm.invalid || isLoading()"
            class="w-full py-2.5 px-4 rounded-xl font-medium text-sm transition cursor-pointer flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed bg-zinc-900 hover:bg-zinc-800 dark:bg-white dark:text-zinc-950 dark:hover:bg-zinc-200 text-white active:scale-[0.99]"
          >
            @if (isLoading()) {
              <svg class="animate-spin h-4 w-4 text-white dark:text-zinc-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Salvando...</span>
            } @else {
              <span>Concluir e Acessar Painel</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
