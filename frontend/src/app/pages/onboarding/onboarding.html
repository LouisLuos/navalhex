<div class="min-h-screen bg-zinc-950 flex items-center justify-center p-4 sm:p-6 lg:p-8 text-zinc-100 font-sans selection:bg-amber-500 selection:text-zinc-950">
  <!-- Background Glow Effect -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-amber-600/10 rounded-full blur-3xl"></div>
  </div>

  <div class="w-full max-w-xl relative z-10">
    <!-- Header / Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-zinc-900 border border-zinc-800 shadow-xl shadow-black/50 mb-4 text-amber-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20 mb-2">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
        Primeiro Acesso — Configuração Inicial
      </span>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mt-2">Cadastre sua Barbearia</h1>
      <p class="text-sm text-zinc-400 mt-1">Preencha os dados do seu negócio para gerar o seu link público de agendamentos</p>
    </div>

    <!-- Card Form -->
    <div class="bg-zinc-900/80 backdrop-blur-xl border border-zinc-800/80 rounded-2xl p-6 sm:p-8 shadow-2xl shadow-black/80">
      
      <!-- Error Alert -->
      @if (errorMessage()) {
        <div class="mb-6 p-4 rounded-xl bg-red-950/40 border border-red-500/30 text-red-400 text-sm flex items-start gap-3 animate-in fade-in duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0 mt-0.5 text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <div class="flex-1 font-medium">{{ errorMessage() }}</div>
        </div>
      }

      <form [formGroup]="tenantForm" (ngSubmit)="onSubmit()" class="space-y-4">
        
        <!-- Nome Fantasia -->
        <div>
          <label for="companyName" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Nome da Barbearia</label>
          <input
            type="text"
            id="companyName"
            formControlName="companyName"
            (input)="onNameChange()"
            placeholder="Ex: Barbearia Navalhex Prime"
            class="w-full px-4 py-2.5 rounded-xl bg-zinc-950/60 border border-zinc-800 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition duration-150 text-sm"
          />
        </div>

        <!-- Slug / Link Público -->
        <div>
          <label for="slug" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Link Público Personalizado (Slug)</label>
          <div class="flex rounded-xl bg-zinc-950/60 border border-zinc-800 focus-within:border-amber-500 focus-within:ring-1 focus-within:ring-amber-500 transition duration-150 overflow-hidden">
            <span class="inline-flex items-center px-3 text-xs text-zinc-500 bg-zinc-900/50 border-r border-zinc-800">navalhex.com/</span>
            <input
              type="text"
              id="slug"
              formControlName="slug"
              placeholder="barbearia-prime"
              class="w-full px-3 py-2.5 bg-transparent text-white placeholder-zinc-500 focus:outline-none text-sm"
            />
          </div>
          <p class="text-[11px] text-zinc-500 mt-1">Este será o link direto que seus clientes usarão para agendar horários.</p>
        </div>

        <!-- Horários de Funcionamento (Grid) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="openingHours" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Horário de Abertura</label>
            <input
              type="time"
              id="openingHours"
              formControlName="openingHours"
              class="w-full px-4 py-2.5 rounded-xl bg-zinc-950/60 border border-zinc-800 text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition duration-150 text-sm"
            />
          </div>

          <div>
            <label for="closingHours" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Horário de Fechamento</label>
            <input
              type="time"
              id="closingHours"
              formControlName="closingHours"
              class="w-full px-4 py-2.5 rounded-xl bg-zinc-950/60 border border-zinc-800 text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition duration-150 text-sm"
            />
          </div>
        </div>

        <!-- WhatsApp da Barbearia -->
        <div>
          <label for="whatsapp" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">WhatsApp Comercial</label>
          <input
            type="text"
            id="whatsapp"
            formControlName="whatsapp"
            placeholder="(11) 98765-4321"
            class="w-full px-4 py-2.5 rounded-xl bg-zinc-950/60 border border-zinc-800 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition duration-150 text-sm"
          />
        </div>

        <!-- Endereço Completo -->
        <div>
          <label for="companyAddress" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Endereço da Unidade</label>
          <input
            type="text"
            id="companyAddress"
            formControlName="companyAddress"
            placeholder="Ex: Av. Paulista, 1000 - Bela Vista, São Paulo - SP"
            class="w-full px-4 py-2.5 rounded-xl bg-zinc-950/60 border border-zinc-800 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition duration-150 text-sm"
          />
        </div>

        <!-- Submit Button -->
        <div class="pt-4">
          <button
            type="submit"
            [disabled]="tenantForm.invalid || isLoading()"
            class="w-full py-3 px-4 rounded-xl font-semibold text-sm transition-all duration-200 shadow-lg cursor-pointer flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-none bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-zinc-950 shadow-amber-500/20 active:scale-[0.98]"
          >
            @if (isLoading()) {
              <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-zinc-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Salvando Barbearia...</span>
            } @else {
              <span>Concluir e Acessar Painel</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
